<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>童話夢想島：中文打字開拓記</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #38bdf8;
    }
    #threeCanvasWrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }
    #threeCanvasWrapper:active {
      cursor: grabbing;
    }
    .hud-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }
    .interactive {
      pointer-events: auto;
    }
    .glass-hud {
      background: rgba(15, 23, 42, 0.76);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.5);
    }
    .side-control-panel {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(52, 211, 153, 0.35);
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.65);
    }
    .solid-wordcard {
      background: rgba(2, 6, 23, 0.65) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(52, 211, 153, 0.45) !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .zhuyin-char {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 0.35rem;
      position: relative;
    }
    .zhuyin-ruby {
      font-size: 0.95rem;
      font-weight: 700;
      color: #93c5fd;
      letter-spacing: 0.05em;
      line-height: 1.1;
      margin-bottom: 0.2rem;
    }
    .main-hanzi {
      font-size: 3.1rem;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    }
    @media (max-width: 640px) {
      .main-hanzi {
        font-size: 2.1rem;
      }
      .zhuyin-ruby {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body class="relative w-full h-full overflow-hidden">

  <!-- 3D 渲染畫布容器 -->
  <div id="threeCanvasWrapper"></div>

  <!-- HUD 介面層：採用左右獨立區域，徹底避免字卡遮擋 3D 小島 -->
  <div class="hud-layer flex flex-col justify-between p-2 sm:p-4">
    
    <!-- 頂部資訊列 (緊湊置頂) -->
    <header class="flex justify-between items-center w-full max-w-7xl mx-auto interactive gap-2">
      <!-- 標題與島嶼繁榮等級 -->
      <div class="glass-hud px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-2xl flex items-center gap-2.5">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
        <div>
          <h1 class="text-[11px] font-bold tracking-wider text-slate-300">童話夢想島</h1>
          <div id="islandRankBadge" class="text-xs sm:text-sm font-black text-emerald-300">Lv.1 寧靜荒島</div>
        </div>
      </div>

      <!-- 當前難度顯示標籤 (遊戲中鎖定無法更換) -->
      <div class="glass-hud px-3.5 py-1.5 rounded-2xl flex items-center gap-2">
        <span class="text-[10px] text-slate-400 font-bold block leading-tight">目前難度</span>
        <span id="currentDiffBadge" class="font-black text-emerald-400 text-xs sm:text-sm">簡易</span>
      </div>

      <!-- 狀態欄 (天色、特殊地標進度、積分、音效) -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- 5 題特殊地標倒數 -->
        <div class="glass-hud px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-2xl text-center hidden sm:block">
          <span class="text-[10px] text-slate-400 block leading-tight">紀念地標</span>
          <span id="milestoneCounter" class="font-bold text-cyan-300 text-xs sm:text-sm">0 / 5</span>
        </div>

        <div class="glass-hud px-2.5 py-1 sm:px-3.5 sm:py-1.5 rounded-2xl text-center">
          <span class="text-[10px] text-slate-400 block leading-tight">天色</span>
          <span id="dayTimeBadge" class="font-bold text-amber-300 text-xs sm:text-sm">中午</span>
        </div>

        <div class="glass-hud px-3 py-1 sm:px-4 sm:py-1.5 rounded-2xl text-center">
          <span class="text-[10px] text-slate-400 block leading-tight">開拓積分</span>
          <span id="scoreEl" class="font-black text-amber-400 text-sm sm:text-base">0</span>
        </div>

        <!-- 獨立背景音樂按鈕與音效按鈕（純文字 ON/OFF 顯示） -->
        <button id="bgmBtn" class="glass-hud px-3 py-2 rounded-2xl text-xs font-bold text-emerald-300 hover:text-white hover:bg-slate-700/60 transition active:scale-95" title="背景音樂開關">
          音樂 ON
        </button>

        <button id="muteBtn" class="glass-hud px-3 py-2 rounded-2xl text-xs font-bold text-emerald-300 hover:text-white hover:bg-slate-700/60 transition active:scale-95" title="音效開關">
          音效 ON
        </button>
      </div>
    </header>

    <!-- 中部至底部操作區：左側完全留空給 3D 小島，右側配置專屬字卡與打字控制台 -->
    <div class="flex-1 flex flex-col md:flex-row items-end justify-between w-full max-w-7xl mx-auto pointer-events-none mt-2 pb-1">
      
      <!-- 左側 3D 小島展示區（點擊穿透，無任何文字遮擋） -->
      <div class="flex-1 w-full h-full min-h-[40px] pointer-events-none"></div>

      <!-- 右側專屬字卡與打字控制台（桌面端靠右專屬邊欄，不重疊左側島嶼） -->
      <aside class="w-full md:w-[380px] lg:w-[410px] flex flex-col gap-2.5 interactive side-control-panel p-3.5 sm:p-4 rounded-3xl">
        
        <!-- 活力進度條 -->
        <div class="w-full bg-slate-900/90 px-3 py-1.5 rounded-xl flex items-center gap-2 border border-slate-700/60">
          <span class="text-[10px] font-bold text-slate-300 whitespace-nowrap">島嶼活力</span>
          <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden p-0.5 border border-slate-700">
            <div id="vitalityBar" class="h-full bg-gradient-to-r from-amber-400 to-emerald-400 rounded-full transition-all duration-300" style="width: 100%;"></div>
          </div>
          <span id="vitalityPercent" class="text-[11px] font-black text-emerald-400 min-w-[32px] text-right">100%</span>
        </div>

        <!-- 題目大字卡 -->
        <div id="wordCard" class="w-full solid-wordcard px-4 py-3 rounded-2xl flex flex-col items-center justify-center">
          <div class="text-[11px] font-bold text-emerald-300 tracking-wider mb-1" id="nextUpgradeHint">
            輸入目標字詞・開拓全新島嶼造物
          </div>
          <div id="charCardsContainer" class="flex items-center justify-center flex-wrap py-0.5">
            <!-- 動態載入字卡與注音 -->
          </div>
        </div>

        <!-- 升級或紀念地標落成橫幅 -->
        <div id="upgradeBanner" class="hidden text-xs font-black text-center px-3 py-1.5 rounded-xl bg-emerald-500 text-slate-950 shadow-lg tracking-wider transition-all duration-300">
          建築升級完成！
        </div>

        <!-- 打字輸入框與送出按鈕 -->
        <div class="flex items-center gap-2">
          <input 
            id="typeInput" 
            type="text" 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="off" 
            spellcheck="false"
            placeholder="請看上方注音輸入..." 
            class="flex-1 bg-slate-900/95 border border-slate-700 text-white font-bold text-base px-3.5 py-2 rounded-xl focus:outline-none focus:border-emerald-400 placeholder:text-slate-500 text-center tracking-widest transition"
          />
          <button id="submitBtn" class="bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-black px-4 py-2 rounded-xl transition text-sm tracking-wider">
            送出
          </button>
        </div>

        <div class="text-center text-[10px] text-slate-400 tracking-wider">
          提示：滑鼠按住畫面左側可 360° 旋轉觀賞小島
        </div>
      </aside>
    </div>

  </div>

  <!-- 開始遊戲彈窗 (純文字現代風格) -->
  <div id="startOverlay" class="absolute inset-0 z-50 flex items-center justify-center bg-slate-950/75 backdrop-blur-md p-4">
    <div class="glass-hud max-w-md w-full p-6 sm:p-8 rounded-3xl text-center border border-slate-700/80 text-white space-y-4">
      <div class="space-y-1">
        <span class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Island Expedition</span>
        <h2 class="text-2xl sm:text-3xl font-black text-white">童話夢想島</h2>
        <p class="text-xs sm:text-sm text-slate-300">中文打字開拓記</p>
      </div>

      <div class="text-xs sm:text-sm text-slate-300 text-left space-y-2 bg-slate-900/60 p-4 rounded-2xl border border-slate-800 leading-relaxed">
        <p>1. 根據上方字卡輸入中文詞彙</p>
        <p>2. 每次輸入正確會越島嶼注入活力，陸續誕生物件</p>
        <p>3. 通過5題就會獲得「紀念地標」</p>
      </div>

      <!-- 進入遊戲前的難度選擇區 -->
      <div class="text-left space-y-2">
        <label class="text-xs font-bold text-slate-300 block">請選擇開拓難度（遊戲開始後無法更改）：</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" data-diff="easy" class="start-diff-btn p-2.5 rounded-xl border border-emerald-500 bg-emerald-500/20 text-emerald-300 font-bold text-xs sm:text-sm transition flex flex-col items-center">
            <span>簡易</span>
            <span class="text-[10px] font-normal text-slate-400 mt-0.5">2字詞為主</span>
          </button>
          <button type="button" data-diff="medium" class="start-diff-btn p-2.5 rounded-xl border border-slate-700 bg-slate-900/60 text-slate-300 hover:text-white font-bold text-xs sm:text-sm transition flex flex-col items-center">
            <span>普通</span>
            <span class="text-[10px] font-normal text-slate-400 mt-0.5">2~3字均衡</span>
          </button>
          <button type="button" data-diff="hard" class="start-diff-btn p-2.5 rounded-xl border border-slate-700 bg-slate-900/60 text-slate-300 hover:text-white font-bold text-xs sm:text-sm transition flex flex-col items-center">
            <span>困難</span>
            <span class="text-[10px] font-normal text-slate-400 mt-0.5">成語名句</span>
          </button>
        </div>
      </div>

      <button id="startBtn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-base sm:text-lg py-3 rounded-xl border border-emerald-300/50 shadow-xl transition transform active:scale-95 tracking-widest">
        開始開拓小島
      </button>
    </div>
  </div>

  <!-- 遊戲結束結算彈窗 -->
  <div id="gameOverOverlay" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
    <div class="glass-hud max-w-sm w-full p-6 sm:p-8 rounded-3xl text-center border border-slate-700 text-white space-y-4">
      <div class="space-y-1">
        <span class="text-xs uppercase tracking-widest text-amber-400 font-bold">Expedition Finished</span>
        <h2 class="text-2xl font-black">島嶼開拓報告</h2>
        <p class="text-xs text-slate-400">活力耗盡，開拓暫告一段落</p>
      </div>

      <div class="bg-slate-900/70 p-4 rounded-2xl text-sm space-y-2 border border-slate-800">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <span class="text-slate-400 text-xs">小島繁榮等級</span>
          <span id="finalIslandRank" class="font-bold text-emerald-400 text-sm">Lv.1 寧靜荒島</span>
        </div>
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <span class="text-slate-400 text-xs">完成詞彙題數</span>
          <span id="finalCorrectCount" class="font-bold text-cyan-400 text-sm">0 題</span>
        </div>
        <div class="flex justify-between items-center pt-1">
          <span class="text-slate-400 text-xs">開拓總分</span>
          <span id="finalScore" class="font-black text-amber-400 text-2xl">0</span>
        </div>
      </div>

      <!-- 失敗後可重新選擇難度 -->
      <div class="text-left space-y-1.5 pt-1">
        <label class="text-xs font-bold text-slate-300 block">重新選擇挑戰難度：</label>
        <div class="grid grid-cols-3 gap-1.5">
          <button type="button" data-diff="easy" class="over-diff-btn py-1.5 px-2 rounded-xl border border-emerald-500 bg-emerald-500/20 text-emerald-300 font-bold text-xs transition text-center">
            簡易
          </button>
          <button type="button" data-diff="medium" class="over-diff-btn py-1.5 px-2 rounded-xl border border-slate-700 bg-slate-900/60 text-slate-300 hover:text-white font-bold text-xs transition text-center">
            普通
          </button>
          <button type="button" data-diff="hard" class="over-diff-btn py-1.5 px-2 rounded-xl border border-slate-700 bg-slate-900/60 text-slate-300 hover:text-white font-bold text-xs transition text-center">
            困難
          </button>
        </div>
      </div>

      <button id="restartBtn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-base py-3 rounded-xl border border-emerald-300 shadow-xl transition transform active:scale-95 tracking-widest">
        重新開拓
      </button>
    </div>
  </div>

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmMuted = false;
        this.nightTimer = null;
        this.bgmTimer = null;
        this.bgmStep = 0;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTone(freq, duration, type = 'sine', gainVal = 0.15) {
        if (this.muted) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      // 輕柔音樂盒／木琴音色（柔和 sine + 輕微泛音，極度放鬆治癒）
      playMelodyNote(freq, duration = 0.45, gainVal = 0.045) {
        if (this.bgmMuted) return;
        this.init();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(gainVal, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          // 輕微低通濾波讓音色更加圓潤溫暖
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1400, now);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + duration);
        } catch(e) {}
      }
      // 啟動童話風治癒背景輕音樂
      startBGM() {
        if (this.bgmTimer) return;
        this.init();

        // 溫馨平靜的 C 大調 / 晨曦島嶼和弦旋律進程
        // 音高對應表 (Hz)
        const C4 = 261.63, D4 = 293.66, E4 = 329.63, F4 = 349.23, G4 = 392.00, A4 = 440.00, B4 = 493.88;
        const C5 = 523.25, D5 = 587.33, E5 = 659.25, G5 = 783.99, A5 = 880.00;

        // 旋律小節譜曲（主音 + 柔和伴奏）
        const melodyTrack = [
          // 小節 1 (C 和弦)
          { note: E5, bass: C4 }, { note: G5 }, { note: C5 }, { note: E5 },
          // 小節 2 (Am 和弦)
          { note: C5, bass: A4 }, { note: E5 }, { note: A5 }, { note: E5 },
          // 小節 3 (F 和弦)
          { note: A4, bass: F4 }, { note: C5 }, { note: F4 }, { note: A4 },
          // 小節 4 (G 和弦)
          { note: B4, bass: G4 }, { note: D5 }, { note: G4 }, { note: D4 },
          // 小節 5 (C 和弦旋律起伏)
          { note: G5, bass: C4 }, { note: E5 }, { note: D5 }, { note: C5 },
          // 小節 6 (Em 和弦)
          { note: B4, bass: E4 }, { note: G4 }, { note: E5 }, { note: B4 },
          // 小節 7 (F 和弦)
          { note: A4, bass: F4 }, { note: C5 }, { note: D5 }, { note: E5 },
          // 小節 8 (G 和弦收束)
          { note: D5, bass: G4 }, { note: B4 }, { note: G4 }, { note: D4 }
        ];

        this.bgmStep = 0;
        this.bgmTimer = setInterval(() => {
          if (this.bgmMuted) return;
          const currentStep = melodyTrack[this.bgmStep % melodyTrack.length];
          if (currentStep.note) {
            this.playMelodyNote(currentStep.note, 0.42, 0.045);
          }
          if (currentStep.bass) {
            this.playMelodyNote(currentStep.bass, 0.65, 0.035);
          }
          this.bgmStep++;
        }, 340); // 舒服休閒的中慢板節奏
      }
      stopBGM() {
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
      }
      toggleBGM() {
        this.bgmMuted = !this.bgmMuted;
        if (!this.bgmMuted) {
          this.startBGM();
        }
        return this.bgmMuted;
      }
      correctChime() {
        this.playTone(523.25, 0.12, 'triangle', 0.2); // C5
        setTimeout(() => this.playTone(659.25, 0.15, 'triangle', 0.25), 85); // E5
        setTimeout(() => this.playTone(783.99, 0.25, 'triangle', 0.25), 170); // G5
      }
      buildPop() {
        this.playTone(320, 0.08, 'sine', 0.22);
        setTimeout(() => this.playTone(580, 0.18, 'sine', 0.2), 65);
      }
      upgradeFanfare() {
        const notes = [440, 554.37, 659.25, 880, 1108.73];
        notes.forEach((f, idx) => {
          setTimeout(() => this.playTone(f, 0.24, 'triangle', 0.24), idx * 95);
        });
      }
      // 柔和夏夜微風蟋蟀蟲鳴 (絕無刺耳高頻蜂鳴)
      startNightAmbient() {
        if (this.muted || this.nightTimer) return;
        this.init();
        const chirpCricket = () => {
          if (this.muted || !this.nightTimer) return;
          try {
            const now = this.ctx.currentTime;
            [0, 0.06, 0.12].forEach(dt => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(4500, now + dt);
              osc.frequency.exponentialRampToValueAtTime(4100, now + dt + 0.035);
              gain.gain.setValueAtTime(0.012, now + dt);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + dt + 0.035);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + dt);
              osc.stop(now + dt + 0.035);
            });
          } catch(e) {}
        };
        chirpCricket();
        this.nightTimer = setInterval(chirpCricket, 2600);
      }
      stopNightAmbient() {
        if (this.nightTimer) {
          clearInterval(this.nightTimer);
          this.nightTimer = null;
        }
      }
      toggleMute() {
        this.muted = !this.muted;
        if (this.muted) this.stopNightAmbient();
        return this.muted;
      }
    }

    // 乾淨純粹的海洋顏色分層 ＆ 多重立體湧浪圈
    function createLayeredOceanAndSwells() {
      // 1. 最底層：外海深邃深藍基底
      const oceanGeo = new THREE.CylinderGeometry(280, 280, 2.0, 64);
      const oceanMat = new THREE.MeshStandardMaterial({
        color: 0x0369a1, // 沉穩深邃藍
        roughness: 0.15,
        metalness: 0.1
      });
      oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
      oceanMesh.position.y = -1.0;
      oceanMesh.receiveShadow = true;
      scene.add(oceanMesh);

      // 2. 顏色分層：中外海蔚藍水環 (層次 1)
      const midSeaGeo = new THREE.RingGeometry(32.0, 100.0, 64);
      midSeaGeo.rotateX(-Math.PI / 2);
      const midSeaMat = new THREE.MeshStandardMaterial({
        color: 0x0284c7, // 蔚藍海色
        roughness: 0.2,
        transparent: true,
        opacity: 0.88,
        side: THREE.DoubleSide
      });
      const midSeaMesh = new THREE.Mesh(midSeaGeo, midSeaMat);
      midSeaMesh.position.y = 0.02;
      scene.add(midSeaMesh);

      // 3. 顏色分層：內海天藍淺海環 (層次 2)
      const shallowGeo = new THREE.RingGeometry(22.0, 32.0, 64);
      shallowGeo.rotateX(-Math.PI / 2);
      const shallowMat = new THREE.MeshStandardMaterial({
        color: 0x0ea5e9, // 亮天藍
        roughness: 0.2,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide
      });
      const shallowMesh = new THREE.Mesh(shallowGeo, shallowMat);
      shallowMesh.position.y = 0.08;
      scene.add(shallowMesh);

      // 4. 顏色分層：緊鄰沙灘的清透碧藍水環 (層次 3)
      const lagoonGeo = new THREE.RingGeometry(18.2, 22.0, 64);
      lagoonGeo.rotateX(-Math.PI / 2);
      const lagoonMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8, // 剔透淺青藍
        roughness: 0.2,
        transparent: true,
        opacity: 0.82,
        side: THREE.DoubleSide
      });
      const lagoonMesh = new THREE.Mesh(lagoonGeo, lagoonMat);
      lagoonMesh.position.y = 0.14;
      scene.add(lagoonMesh);

      // 5. 多重立體湧浪圈（環繞小島、向外柔和擴散的純白立體水波紋）
      const ringCount = 6;
      for (let i = 0; i < ringCount; i++) {
        // 使用超細緻圓環製作平滑立體湧浪圈
        const ringGeo = new THREE.TorusGeometry(1.0, 0.08, 8, 80);
        ringGeo.rotateX(Math.PI / 2);
        const ringMat = new THREE.MeshStandardMaterial({
          color: 0xf0f9ff,
          roughness: 0.3,
          transparent: true,
          opacity: 0.0
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.set(0, 0.18, 0);
        scene.add(ringMesh);

        concentricSwellRings.push({

    // 繁星點點星空系統 (夜晚璀璨閃爍)
    function createStarfield() {
      const starCount = 680;
      const starGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(starCount * 3);
      const colors = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * (Math.PI / 2.15);
        const rad = 130 + Math.random() * 60;
        positions[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = rad * Math.cos(phi) + 8;
        positions[i * 3 + 2] = rad * Math.sin(phi) * Math.sin(theta);

        const tint = Math.random();
        if (tint > 0.6) {
          colors[i * 3] = 0.95; colors[i * 3 + 1] = 0.92; colors[i * 3 + 2] = 0.65;
        } else if (tint > 0.3) {
          colors[i * 3] = 0.65; colors[i * 3 + 1] = 0.85; colors[i * 3 + 2] = 1.0;
        } else {
          colors[i * 3] = 1.0; colors[i * 3 + 1] = 1.0; colors[i * 3 + 2] = 1.0;
        }
      }

      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const starMat = new THREE.PointsMaterial({
        size: 1.8,
        vertexColors: true,
        transparent: true,
        opacity: 0.0
      });
      starsParticleSystem = new THREE.Points(starGeo, starMat);
      scene.add(starsParticleSystem);
    }

    function createFloatingClouds() {
      const cloudMat = new THREE.MeshStandardMaterial({
        color: 0xf8fafc,
        roughness: 0.95,
        transparent: true,
        opacity: 0.92
      });

      for (let i = 0; i < 7; i++) {
        const cloud = new THREE.Group();
        const baseRadius = 2.2 + Math.random() * 1.4;
        const puffCount = 5 + Math.floor(Math.random() * 4);

        for (let j = 0; j < puffCount; j++) {
          const r = baseRadius * (0.55 + Math.random() * 0.45);
          const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 1), cloudMat);
          puff.position.set((j - puffCount / 2) * 1.5, (Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 1.5);
          cloud.add(puff);
        }

        const angle = (i / 7) * Math.PI * 2;
        const dist = 26 + Math.random() * 12;
        cloud.position.set(Math.cos(angle) * dist, 18 + Math.random() * 6, Math.sin(angle) * dist);
        scene.add(cloud);
        floatingClouds.push({ group: cloud, speed: 0.0016 + Math.random() * 0.0012, dist: dist, angle: angle });
      }
    }

    // 豐富地形：深綠色 #009944、梯田稻田、連綿山脈、湖泊、S型河流
    function createRichIslandTerrain() {
      const terrainGroup = new THREE.Group();

      // 1. 金黃沙灘裙邊
      const sandShape = new THREE.Shape();
      const numPts = 48;
      const baseRadius = 18.0;

      for (let i = 0; i < numPts; i++) {
        const angle = (i / numPts) * Math.PI * 2;
        const r = baseRadius 
          + Math.sin(angle * 2.0) * 3.3 
          + Math.cos(angle * 3.0) * 2.5 
          + Math.sin(angle * 5.0) * 1.2;
        const px = Math.cos(angle) * r;
        const pz = Math.sin(angle) * r;
        if (i === 0) sandShape.moveTo(px, pz);
        else sandShape.lineTo(px, pz);
      }
      sandShape.closePath();

      const sandGeo = new THREE.ExtrudeGeometry(sandShape, {
        depth: 0.85,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.7,
        bevelThickness: 0.35
      });
      sandGeo.rotateX(-Math.PI / 2);
      const sandMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.95 });
      const sandMesh = new THREE.Mesh(sandGeo, sandMat);
      sandMesh.position.set(0, 0.2, 0);
      sandMesh.receiveShadow = true;
      terrainGroup.add(sandMesh);

      // 2. 指定色碼 #009944 之自然大地深綠草地表層
      const grassShape = new THREE.Shape();
      const grassRadius = 16.5;
      for (let i = 0; i < numPts; i++) {
        const angle = (i / numPts) * Math.PI * 2;
        const r = grassRadius 
          + Math.sin(angle * 2.0) * 3.0 
          + Math.cos(angle * 3.0) * 2.2 
          + Math.sin(angle * 5.0) * 1.0;
        const px = Math.cos(angle) * r;
        const pz = Math.sin(angle) * r;
        if (i === 0) grassShape.moveTo(px, pz);
        else grassShape.lineTo(px, pz);
      }
      grassShape.closePath();

      const grassGeo = new THREE.ExtrudeGeometry(grassShape, {
        depth: 0.75,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.55,
        bevelThickness: 0.25
      });
      grassGeo.rotateX(-Math.PI / 2);

      const grassMat = new THREE.MeshStandardMaterial({ 
        color: new THREE.Color("#009944"), 
        roughness: 0.78, 
        metalness: 0.0

      const grassMesh = new THREE.Mesh(grassGeo, grassMat);
      grassMesh.position.set(0, 0.72, 0);
      grassMesh.receiveShadow = true;
      grassMesh.castShadow = true;
      terrainGroup.add(grassMesh);

      // 3. 連綿雪頂山脈群
      const mountainPeaks = [
        { x: -6.0, z: -5.5, r: 5.5, h: 5.6, snow: 1.8 },
        { x: -8.8, z: -3.8, r: 4.8, h: 4.6, snow: 1.4 },

      const rockMat = new THREE.MeshStandardMaterial({ color: 0x3f3f46, roughness: 0.9 });
      const snowMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.35 });

      mountainPeaks.forEach(m => {

        mountainGroup.position.set(m.x, 1.35, m.z);

      lakeGroup.add(lakeMesh);

      const lilyMat = new THREE.MeshStandardMaterial({ color: 0x14532d });
      [
        { x: -0.9, z: 0.3, r: 0.3 },

        lakeGroup.add(lily);

      // 6. S 曲線蜿蜒小河
      const riverPts = [

        new THREE.Vector3(-1.8, 1.38, -3.2),
        new THREE.Vector3(-0.2, 1.37, -1.8),
        new THREE.Vector3(1.6, 1.37, -1.2),
        new THREE.Vector3(2.8, 1.36, 0.2),
        new THREE.Vector3(4.2, 1.36, 1.6),
        new THREE.Vector3(6.8, 1.35, 3.4),
        new THREE.Vector3(9.8, 1.33, 4.8),
        new THREE.Vector3(13.2, 1.30, 7.2),
        new THREE.Vector3(16.5, 1.25, 9.8)

      const riverCurve = new THREE.CatmullRomCurve3(riverPts);
      const riverGeo = new THREE.TubeGeometry(riverCurve, 80, 0.55, 8, false);
      const riverMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        roughness: 0.18,
        metalness: 0.32,
        transparent: true,
        opacity: 0.9

      scene.add(terrainGroup);

    function setupCameraControls() {
      let isDragging = false;
      let prevMouseX = 0;
      let sphericalAngle = 0;
      const camDist = 52;

      function onPointerDown(e) {
        // 若點擊在右側控制台內部，不觸發視角旋轉
        if (e.target.closest('.side-control-panel') || e.target.closest('input') || e.target.closest('button')) {
          return;
        }
        isDragging = true;
        prevMouseX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const deltaX = currentX - prevMouseX;
        prevMouseX = currentX;

        sphericalAngle -= deltaX * 0.006;
        applyCameraPosition(sphericalAngle, camDist);
      }

      function onPointerUp() {
        isDragging = false;
      }

      window.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      window.addEventListener('touchstart', onPointerDown, { passive: true });
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('touchend', onPointerUp, { passive: true });
    }

    // 計算視角與島嶼中心偏移量（將小島完美呈現在非遮擋區域）
    function applyCameraPosition(angle = 0, dist = 52) {
      if (!camera) return;
      const isDesktop = window.innerWidth >= 768;
      // 桌面端視角中心向左偏移 4.5 單位，徹底避開右側控制欄；行動端向上偏移 4.5 單位避開下欄
      const targetX = isDesktop ? -4.5 : 0;
      const targetY = isDesktop ? 2.5 : 4.5;
      const targetZ = 0;

      camera.position.x = targetX + Math.sin(angle) * dist;
      camera.position.y = 35;
      camera.position.z = targetZ + Math.cos(angle) * dist;
      camera.lookAt(targetX, targetY, targetZ);
    }

    function adjustCameraViewport() {
      applyCameraPosition(0, 52);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      adjustCameraViewport();
    }

    function updateDayNightCycle(dt) {
      timeCycle = (timeCycle + dt * 0.012) % 1.0;

      let p = 1;
      let skyCol = new THREE.Color(0x38bdf8);
      let sunIntensity = 0.95;
      let starOpacity = 0.0;
      let isNight = false;

      if (timeCycle < 0.25) {
        // 清晨
        p = 0;
        const alpha = timeCycle / 0.25;
        skyCol = new THREE.Color(0x1e1b4b).lerp(new THREE.Color(0xfdba74), alpha);
        sunIntensity = 0.4 + alpha * 0.55;
        starOpacity = Math.max(0, 1.0 - alpha * 2.0);
      } else if (timeCycle < 0.5) {
        // 中午
        p = 1;
        skyCol = new THREE.Color(0x38bdf8);
        sunIntensity = 0.95;
        starOpacity = 0.0;
      } else if (timeCycle < 0.75) {
        // 晚霞
        p = 2;
        const alpha = (timeCycle - 0.5) / 0.25;
        skyCol = new THREE.Color(0x38bdf8).lerp(new THREE.Color(0xf43f5e), alpha);
        sunIntensity = 0.95 - alpha * 0.5;
        starOpacity = 0.0;
      } else {
        // 夜晚 (繁星璀璨)
        p = 3;
        const alpha = (timeCycle - 0.75) / 0.25;
        skyCol = new THREE.Color(0xf43f5e).lerp(new THREE.Color(0x020617), alpha);
        sunIntensity = 0.15;
        starOpacity = 1.0;
        isNight = true;
      }

      if (scene) {
        scene.background = skyCol;
        if (scene.fog) scene.fog.color = skyCol;
      }
      if (sunLight) sunLight.intensity = sunIntensity;

      if (starsParticleSystem && starsParticleSystem.material) {
        starsParticleSystem.material.opacity = starOpacity;
      }

      // 夜間亮燈
      islandNightLights.forEach(item => {
        if (isNight) {
          item.mat.emissive.setHex(item.glowColor);
          item.mat.emissiveIntensity = item.glowIntensity;
        } else {
          item.mat.emissive.setHex(0x000000);
          item.mat.emissiveIntensity = 0.0;
        }
      });

      // 夜晚環境蟋蟀鳴叫
      if (isNight && gameState === 'RUNNING') {
        sound.startNightAmbient();
      } else {
        sound.stopNightAmbient();
      }

      if (p !== timePhase) {
        timePhase = p;
        dayTimeBadge.textContent = TIME_PHASE_NAMES[timePhase];
      }
    }

    const DIFF_CONFIG = {
      easy: { name: '簡易', colorClass: 'text-emerald-400', activeBg: 'bg-emerald-500/25', border: 'border-emerald-500', text: 'text-emerald-300' },
      medium: { name: '普通', colorClass: 'text-amber-400', activeBg: 'bg-amber-500/25', border: 'border-amber-500', text: 'text-amber-300' },
      hard: { name: '困難', colorClass: 'text-rose-400', activeBg: 'bg-rose-500/25', border: 'border-rose-500', text: 'text-rose-300' }
    };

    function setDifficulty(diff) {
      currentDifficulty = diff;
      const conf = DIFF_CONFIG[diff];

      // 更新頂部顯示標籤
      if (currentDiffBadge) {
        currentDiffBadge.textContent = conf.name;
        currentDiffBadge.className = `font-black text-xs sm:text-sm ${conf.colorClass}`;
      }

      // 更新開始畫面按鈕樣式
      startDiffBtns.forEach(btn => {
        const btnDiff = btn.dataset.diff;
        if (btnDiff === diff) {
          btn.className = `start-diff-btn p-2.5 rounded-xl border ${conf.border} ${conf.activeBg} ${conf.text} font-bold text-xs sm:text-sm transition flex flex-col items-center shadow-lg`;
        } else {
          btn.className = `start-diff-btn p-2.5 rounded-xl border border-slate-700 bg-slate-900/60 text-slate-300 hover:text-white font-bold text-xs sm:text-sm transition flex flex-col items-center`;
        }
      });

      // 更新結算畫面按鈕樣式
      overDiffBtns.forEach(btn => {
        const btnDiff = btn.dataset.diff;
        if (btnDiff === diff) {
          btn.className = `over-diff-btn py-1.5 px-2 rounded-xl border ${conf.border} ${conf.activeBg} ${conf.text} font-bold text-xs transition text-center shadow-lg`;
        } else {
          btn.className = `over-diff-btn py-1.5 px-2 rounded-xl border border-slate-700 bg-slate-900/60 text-slate-300 hover:text-white font-bold text-xs transition text-center`;
        }
      });
    }

    startDiffBtns.forEach(btn => {
      btn.addEventListener('click', () => setDifficulty(btn.dataset.diff));
    });

    overDiffBtns.forEach(btn => {
      btn.addEventListener('click', () => setDifficulty(btn.dataset.diff));
    });

    function displayCurrentWord() {
      const list = currentWordList.length > 0 ? currentWordList : WORD_DB.easy;
      const item = list[currentWordIndex % list.length];
      charCardsContainer.innerHTML = '';

      const chars = item.word.split('');
      chars.forEach((c, idx) => {
        const charWrap = document.createElement('div');
        charWrap.className = 'zhuyin-char';

        const ruby = document.createElement('div');
        ruby.className = 'zhuyin-ruby';
        ruby.textContent = (item.ruby && item.ruby[idx]) ? item.ruby[idx] : '';

        const hanzi = document.createElement('div');
        hanzi.className = 'main-hanzi';
        hanzi.textContent = c;

        charWrap.appendChild(ruby);
        charWrap.appendChild(hanzi);
        charCardsContainer.appendChild(charWrap);
      });

      const nextBP = REPEATABLE_PROTOTYPES[currentCreationIndex % REPEATABLE_PROTOTYPES.length];
      nextUpgradeHint.textContent = `輸入目標：【${item.word}】 ➔ 開拓：${nextBP.name}`;

      const stepInCycle = correctCount % 5;
      milestoneCounter.textContent = `${stepInCycle} / 5`;
    }

    function spawnSpecialMonument() {
      const monumentIndex = specialMonumentsSpawned % SPECIAL_MONUMENTS.length;
      const monument = SPECIAL_MONUMENTS[monumentIndex];
      specialMonumentsSpawned++;

      // 50 種紀念品優先分佈在小島外圍四周、沙灘岬角與外圍淺水海域（半徑 12 ~ 17）
      const totalCount = 50;
      const angle = (monumentIndex / totalCount) * Math.PI * 2 + 0.35;
      const rad = 13.5 + (monumentIndex % 4) * 1.5;
      const posX = Math.cos(angle) * rad;
      const posZ = Math.sin(angle) * rad;
      const posY = (rad > 15.0) ? 0.3 : 1.35;

      const monumentObj = monument.build(new THREE.Vector3(posX, posY, posZ));
      monumentObj.scale.set(0.01, 0.01, 0.01);
      scene.add(monumentObj);
      spawnedIslandObjects.push(monumentObj);

      sound.upgradeFanfare();

      let progress = 0;
      const animTimer = setInterval(() => {
        progress += 0.08;
        const s = Math.sin(progress * Math.PI * 0.75) * 1.25;
        if (progress >= 1.0) {
          monumentObj.scale.set(1, 1, 1);
          clearInterval(animTimer);
        } else {
          monumentObj.scale.set(s, s, s);
        }
      }, 16);

      upgradeBanner.textContent = `特殊紀念地標落成：【${monument.name}】！`;
      upgradeBanner.className = "text-xs sm:text-sm font-black px-5 py-2 rounded-full bg-gradient-to-r from-amber-400 to-yellow-300 text-slate-950 shadow-2xl tracking-wider transition-all duration-300";
      upgradeBanner.classList.remove('hidden');
      setTimeout(() => upgradeBanner.classList.add('hidden'), 3600);
    }

    function updateIslandRank() {
      let currentRank = ISLAND_RANKS[0];
      for (let i = ISLAND_RANKS.length - 1; i >= 0; i--) {
        if (correctCount >= ISLAND_RANKS[i].min) {
          currentRank = ISLAND_RANKS[i];
          break;
        }
      }
      islandRankBadge.textContent = currentRank.title;
    }

    function advanceWord() {
      currentWordIndex++;
      displayCurrentWord();
      typeInput.value = '';
    }

    function onWordCorrect() {
      sound.correctChime();
      vitality = Math.min(100, vitality + 30);
      correctCount++;

      // 達到第 10 題（島嶼達到 Lv.4 繁榮海島）時，深海巨鯨優雅登場！
      if (correctCount >= 10 && !whaleUnlocked) {
        spawnOceanWhale();
      }

      // 檢查每 5 題紀念地標獎勵
      if (correctCount % 5 === 0) {
        spawnSpecialMonument();
      } else {
        const blueprint = REPEATABLE_PROTOTYPES[currentCreationIndex % REPEATABLE_PROTOTYPES.length];
        spawnOrUpgradeIslandCreation(blueprint);
        currentCreationIndex++;
      }

      score += (currentDifficulty === 'hard' ? 300 : (currentDifficulty === 'medium' ? 250 : 200));
      scoreEl.textContent = score;

      updateIslandRank();
      advanceWord();
    }

    function checkTypingMatch() {
      if (gameState !== 'RUNNING') return;
      const list = currentWordList.length > 0 ? currentWordList : WORD_DB.easy;
      const target = list[currentWordIndex % list.length].word;
      const val = typeInput.value.trim();

      if (val === target) {
        onWordCorrect();
      }
    }

    typeInput.addEventListener('compositionend', () => {
      setTimeout(checkTypingMatch, 10);
    });

    typeInput.addEventListener('input', () => {
      checkTypingMatch();
    });

    typeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        checkTypingMatch();
      }
    });

    submitBtn.addEventListener('click', () => {
      checkTypingMatch();
      typeInput.focus();
    });

    function startGame() {
      gameState = 'RUNNING';
      score = 0;
      vitality = 100;
      correctCount = 0;
      currentWordIndex = 0;
      currentCreationIndex = 0;
      specialMonumentsSpawned = 0;

      // 重置巨鯨狀態（若之前有出現則自場景中移除）
      if (whaleUnlocked) {
        const whaleIdx = aquaticCreatures.findIndex(a => a.type === 'whale');
        if (whaleIdx !== -1) {
          scene.remove(aquaticCreatures[whaleIdx].group);
          aquaticCreatures.splice(whaleIdx, 1);
        }
        whaleUnlocked = false;
      }

      currentWordList = [...WORD_DB[currentDifficulty]];
      currentWordList.sort(() => Math.random() - 0.5);

      scoreEl.textContent = '0';
      vitalityBar.style.width = '100%';
      vitalityPercent.textContent = '100%';

      spawnedIslandObjects.forEach(obj => scene.remove(obj));
      spawnedIslandObjects.length = 0;
      islandNightLights.length = 0;
      movingPeople.length = 0;
      animalCreatures.length = 0;
      animatedFlowers.length = 0;
      animatedWindows.length = 0;

      updateIslandRank();
      displayCurrentWord();

      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');

      typeInput.disabled = false;
      typeInput.value = '';
      typeInput.focus();

      sound.init();
      sound.startBGM();
    }

    function endGame() {
      gameState = 'GAMEOVER';
      sound.stopNightAmbient();

      let currentRank = ISLAND_RANKS[0];
      for (let i = ISLAND_RANKS.length - 1; i >= 0; i--) {
        if (correctCount >= ISLAND_RANKS[i].min) {
          currentRank = ISLAND_RANKS[i];
          break;
        }
      }

      finalIslandRank.textContent = currentRank.title;
      finalCorrectCount.textContent = `${correctCount} 題`;
      finalScore.textContent = score;

      // 刷新結算彈窗中的難度按鈕為目前難度，方便玩家確認或改選
      setDifficulty(currentDifficulty);

      gameOverOverlay.classList.remove('hidden');
      typeInput.disabled = true;
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    muteBtn.addEventListener('click', () => {
      const isMuted = sound.toggleMute();
      muteBtn.textContent = isMuted ? '音效 OFF' : '音效 ON';
      muteBtn.className = isMuted
        ? "glass-hud px-3 py-2 rounded-2xl text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-700/60 transition active:scale-95"
        : "glass-hud px-3 py-2 rounded-2xl text-xs font-bold text-emerald-300 hover:text-white hover:bg-slate-700/60 transition active:scale-95";
    });

    bgmBtn.addEventListener('click', () => {
      const isBgmMuted = sound.toggleBGM();
      bgmBtn.textContent = isBgmMuted ? '音樂 OFF' : '音樂 ON';
      bgmBtn.className = isBgmMuted 
        ? "glass-hud px-3 py-2 rounded-2xl text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-700/60 transition active:scale-95"
        : "glass-hud px-3 py-2 rounded-2xl text-xs font-bold text-emerald-300 hover:text-white hover:bg-slate-700/60 transition active:scale-95";
    });

    let lastTime = performance.now();

    function animate(currentTime) {
      requestAnimationFrame(animate);

      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      updateDayNightCycle(dt);

      floatingClouds.forEach(c => {
        c.angle += c.speed;
        c.group.position.x = Math.cos(c.angle) * c.dist;
        c.group.position.z = Math.sin(c.angle) * c.dist;
      });

      const t = currentTime * 0.002;

      // 1. 海洋生物與湖泊天鵝生動游動
      aquaticCreatures.forEach(aq => {
        if (aq.type === 'swan') {
          // 天鵝在湖中緩緩繞圈游動，身體永遠朝向遊動正切方向
          aq.angle += aq.speed * dt * 0.4;
          aq.group.position.x = aq.baseX + Math.cos(aq.angle) * aq.radiusX;
          aq.group.position.z = aq.baseZ + Math.sin(aq.angle) * aq.radiusZ;
          aq.group.rotation.y = -aq.angle;
          aq.group.position.y = 1.45 + Math.sin(currentTime * 0.003 + aq.angle) * 0.02;
        } else if (aq.type === 'whale') {
          // 巨鯨在深海大範圍優雅巡航
          aq.angle += aq.speed * dt * 0.15;
          aq.group.position.x = Math.cos(aq.angle) * aq.dist;
          aq.group.position.z = Math.sin(aq.angle) * aq.dist;
          
          // 讓巨鯨頭部順著切線向前前進
          aq.group.rotation.y = -aq.angle - Math.PI / 2;
          
          // 身體隨波浪緩慢起伏並略帶傾角
          const swimWave = Math.sin(currentTime * 0.0018);
          aq.group.position.y = -0.15 + swimWave * 0.28;
          aq.group.rotation.z = Math.cos(currentTime * 0.0018) * 0.08;

          // 水平尾鰭上下規律擺動划水（逼真的鯨魚仿生動態）
          if (aq.tail) {
            aq.tail.rotation.z = Math.sin(currentTime * 0.0028) * 0.28;
          }

          // 左右胸鰭微微滑行扇動
          if (aq.flipperL && aq.flipperR) {
            const finFlap = Math.sin(currentTime * 0.002) * 0.15;
            aq.flipperL.rotation.z = finFlap;
            aq.flipperR.rotation.z = -finFlap;
          }

          // 規律向上噴射多瓣水花水柱
          if (aq.spout) {
            // 每隔一段時間浮出水面噴氣
            const spoutCycle = Math.sin(currentTime * 0.0016);
            if (spoutCycle > 0.4) {
              const grow = (spoutCycle - 0.4) / 0.6;
              aq.spout.visible = true;
              aq.spout.scale.set(grow * 1.1, grow * 1.5, grow * 1.1);
            } else {
              aq.spout.visible = false;
            }
          }
        } else if (aq.type === 'dolphin') {
          // 海豚海面躍水拋物線運動
          aq.angle += aq.speed * dt * 0.45;
          aq.group.position.x = Math.cos(aq.angle) * aq.dist;
          aq.group.position.z = Math.sin(aq.angle) * aq.dist;
          aq.group.rotation.y = -aq.angle - Math.PI / 2;

          const jumpPhase = currentTime * 0.0035 + aq.jumpOffset;
          const jumpHeight = Math.max(-0.6, Math.sin(jumpPhase) * 1.8);
          aq.group.position.y = jumpHeight;
          // 出水抬頭入水俯衝的自然弧度
          aq.group.rotation.x = -Math.cos(jumpPhase) * 0.6;
        }
      });

      // 2. 修正動物移動走向：徹底解決「倒退走」問題，嚴格朝向切線正前方前進
      animalCreatures.forEach(a => {
        const animTime = t * a.speed + a.offset;

        if (a.type === 'cat') {
          // 淘氣小花貓：圓形路徑向前巡邏
          const walkX = Math.cos(animTime) * a.radius;
          const walkZ = Math.sin(animTime) * a.radius;
          a.group.position.x = a.baseX + walkX;
          a.group.position.z = a.baseZ + walkZ;
          // 切線前進朝向（正面朝前跑，不再倒退嚕）
          a.group.rotation.y = -animTime - Math.PI / 2;
          a.group.position.y = 1.35 + Math.abs(Math.sin(animTime * 6.0)) * 0.05;

          if (a.head) {
            a.head.rotation.y = Math.sin(animTime * 2.5) * 0.25; // 好奇歪頭
          }
          if (a.tail) {
            a.tail.rotation.z = Math.sin(animTime * 5.0) * 0.35; // 靈巧擺尾
          }
        } else if (a.type === 'rabbit') {
          // 小白兔：一蹦一跳往前跳躍
          const hop = Math.abs(Math.sin(animTime * 3.5));
          a.group.position.y = 1.35 + hop * 0.35;
          a.group.position.x = a.baseX + Math.cos(animTime) * a.radius;
          a.group.position.z = a.baseZ + Math.sin(animTime) * a.radius;
          // 面向切線正前方前進
          a.group.rotation.y = -animTime - Math.PI / 2;
          if (a.head) {
            a.head.rotation.x = 0.15 - hop * 0.25;
          }
        } else {
          // 小羊、小鹿、乳牛：嚴格順著前進向量前進，抬頭啃草
          const walkX = Math.cos(animTime) * a.radius;
          const walkZ = Math.sin(animTime) * a.radius;
          a.group.position.x = a.baseX + walkX;
          a.group.position.z = a.baseZ + walkZ;
          // 運動切線向前朝向
          a.group.rotation.y = -animTime - Math.PI / 2;
          a.group.position.y = 1.35 + Math.abs(Math.sin(animTime * 4.0)) * 0.05;

          if (a.head) {
            const graze = Math.sin(animTime * 2.0);
            a.head.rotation.x = graze > 0.3 ? 0.45 : 0.0;
            a.head.rotation.y = Math.sin(animTime * 2.5) * 0.2;
          }
        }
      });

      // 3. 花草樹木微風吹拂
      animatedFlowers.forEach(f => {
        if (f.mesh) {
          f.mesh.rotation.z = Math.sin(t * f.speed + f.offset) * f.amp;
        }
      });

      // 4. 百葉窗扇開關
      animatedWindows.forEach(w => {
        const swing = (Math.sin(t * w.speed + w.offset) + 1) * 0.5 * 1.2;
        if (w.left) w.left.rotation.y = -swing;
        if (w.right) w.right.rotation.y = swing;
      });

      // 5. 小島村民來回踏步與熱情揮手
      movingPeople.forEach(p => {
        const anim = t * 1.5 + p.offset;
        p.group.position.x = p.baseX + Math.sin(anim) * p.walkRange;
        if (p.arm) {
          p.arm.rotation.x = Math.sin(anim * 2.5) * 0.45;
        }
      });

      // 6. 多重立體湧浪圈：平滑向外擴散與自然淡入淡出動態
      concentricSwellRings.forEach(ring => {
        ring.progress = (ring.progress + dt * ring.speed) % 1.0;
        const currentRadius = ring.minRadius + (ring.maxRadius - ring.minRadius) * ring.progress;
        
        // 環形向外擴張
        ring.mesh.scale.set(currentRadius, 1.0, currentRadius);

        // 湧浪透明度隨進度如呼吸般淡入、擴散後平滑淡出
        const alpha = Math.sin(ring.progress * Math.PI);
        ring.mesh.material.opacity = alpha * 0.55;

        // 微幅水波垂直起伏
        ring.mesh.position.y = 0.16 + Math.sin(ring.progress * Math.PI * 2) * 0.03;
      });

      // 7. 渲染 3D 場景
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    // 活力自然消耗機制 (遊戲進行時每秒溫和消耗，激勵打字)
    setInterval(() => {
      if (gameState === 'RUNNING') {
        vitality = Math.max(0, vitality - 0.7);
        vitalityBar.style.width = `${vitality}%`;
        vitalityPercent.textContent = `${Math.round(vitality)}%`;
        if (vitality <= 0) {
          endGame();
        }
      }
    }, 500);

    // 視窗載入完成後啟動 3D 小島與動畫循環
    window.onload = function () {
      initThreeScene();
      requestAnimationFrame(animate);
    };
  </script>
</body>
